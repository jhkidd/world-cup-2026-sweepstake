<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: white;
      padding: 40px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #2C3E50;
      margin-bottom: 8px;
    }
    
    .subtitle {
      font-size: 13px;
      color: #7F8C8D;
      margin-bottom: 15px;
    }
    
    .legend {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 30px;
      font-size: 13px;
      color: #7F8C8D;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .legend-swatch {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }
    
    .legend-swatch.left {
      background: #28346E;
    }
    
    .legend-swatch.draw {
      background: #E4E4E6;
    }
    
    .legend-swatch.right {
      background: #E3A344;
    }
    
    .legend-note {
      margin-left: auto;
      font-style: italic;
      font-size: 12px;
    }
    
    /* Two-column grid layout */
    .groups-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      column-gap: 40px;
    }
    
    .group-section {
      margin-bottom: 0;
      break-inside: avoid;
    }
    
    .group-header {
      font-size: 18px;
      font-weight: 700;
      color: #2C3E50;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 2px solid #E0E0E0;
    }
    
    .match-row {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      gap: 10px;
    }
    
    .team-cell {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }
    
    .team-cell.home {
      justify-content: flex-end;
      text-align: right;
    }
    
    .team-cell.away {
      justify-content: flex-start;
      text-align: left;
    }
    
    .team-flag {
      font-size: 16px;
      font-family: "Noto Color Emoji", Arial, sans-serif;
    }
    
    .team-name {
      font-weight: 500;
      color: #2C3E50;
    }
    
    .team-name.favorite {
      font-weight: 700;
    }
    
    .owner {
      font-size: 11px;
      color: #95A5A6;
      margin-left: 4px;
    }
    
    /* Split bar layout - replaces three-box layout */
    .split-bar {
      display: flex;
      height: 32px;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid #BDC3C7;
      flex-grow: 1;
      min-width: 200px;
    }
    
    .bar-section {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: white;
      min-width: 2px;
      position: relative;
    }
    
    .bar-section.left-win {
      background: #28346E;
    }
    
    .bar-section.draw {
      background: #E4E4E6;
      color: #666;
    }
    
    .bar-section.right-win {
      background: #E3A344;
    }
    
    .bar-section .pct-text {
      display: none;
    }
    
    /* Show percentage if section is wide enough */
    .bar-section.show-pct .pct-text {
      display: inline;
    }
    
    .match-date {
      width: 60px;
      flex-shrink: 0;
      font-size: 11px;
      color: #95A5A6;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Upcoming Matches - Matchday 1</h1>
    <div class="subtitle">Updated 27 May 2026 · Monte Carlo match probabilities</div>
    
    <div class="legend">
      <div class="legend-item">
        <div class="legend-swatch left"></div>
        <span>Left team win</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch draw"></div>
        <span>Draw</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch right"></div>
        <span>Right team win</span>
      </div>
      <div class="legend-note">Coloured name = favourite</div>
    </div>
    
    <div class="groups-grid" id="groupsGrid">
      <!-- Groups will be inserted here by JavaScript -->
    </div>
  </div>
  
  <script>
    const data = DATA_PLACEHOLDER;
    
    // Helper functions for color interpolation
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }
    
    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join("");
    }
    
    function interpolateColor(color1, color2, factor) {
      const c1 = hexToRgb(color1);
      const c2 = hexToRgb(color2);
      const r = c1.r + factor * (c2.r - c1.r);
      const g = c1.g + factor * (c2.g - c1.g);
      const b = c1.b + factor * (c2.b - c1.b);
      return rgbToHex(r, g, b);
    }
    
    function getColorForProbability(prob) {
      const colorStops = [
        { prob: 1.00, color: '#6DACA8' },
        { prob: 0.90, color: '#78B4A9' },
        { prob: 0.80, color: '#86BDAA' },
        { prob: 0.70, color: '#94C4AB' },
        { prob: 0.60, color: '#A1CBAC' },
        { prob: 0.50, color: '#B1D5AE' },
        { prob: 0.40, color: '#B9DBB1' },
        { prob: 0.30, color: '#CAE4B5' },
        { prob: 0.20, color: '#DCEEC1' },
        { prob: 0.10, color: '#ECF6D0' },
        { prob: 0.02, color: '#FAFDF0' },
        { prob: 0.00, color: '#FFFFFE' }
      ];
      
      if (prob >= 1.0) return colorStops[0].color;
      if (prob <= 0.0) return colorStops[colorStops.length - 1].color;
      
      for (let i = 0; i < colorStops.length - 1; i++) {
        const upper = colorStops[i];
        const lower = colorStops[i + 1];
        
        if (prob <= upper.prob && prob >= lower.prob) {
          const range = upper.prob - lower.prob;
          const factor = (upper.prob - prob) / range;
          return interpolateColor(upper.color, lower.color, factor);
        }
      }
      
      return colorStops[colorStops.length - 1].color;
    }
    
    function getBrightness(hex) {
      const rgb = hexToRgb(hex);
      return (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
    }
    
    function renderSplitBar(homeWinPct, drawPct, awayWinPct) {
      // Normalize to ensure they sum to 100
      const total = homeWinPct + drawPct + awayWinPct;
      if (total === 0) {
        // No odds available
        return `
          <div class="split-bar">
            <div class="bar-section draw" style="flex-basis: 100%;">
              <span class="pct-text">N/A</span>
            </div>
          </div>
        `;
      }
      
      const leftPct = (homeWinPct / total * 100).toFixed(1);
      const drawPctNorm = (drawPct / total * 100).toFixed(1);
      const rightPct = (awayWinPct / total * 100).toFixed(1);
      
      // Show percentage if section is wide enough (>15%)
      const showLeftPct = parseFloat(leftPct) > 15;
      const showDrawPct = parseFloat(drawPctNorm) > 15;
      const showRightPct = parseFloat(rightPct) > 15;
      
      return `
        <div class="split-bar">
          <div class="bar-section left-win ${showLeftPct ? 'show-pct' : ''}" style="flex-basis: ${leftPct}%;">
            <span class="pct-text">${Math.round(homeWinPct)}%</span>
          </div>
          <div class="bar-section draw ${showDrawPct ? 'show-pct' : ''}" style="flex-basis: ${drawPctNorm}%;">
            <span class="pct-text">${Math.round(drawPct)}%</span>
          </div>
          <div class="bar-section right-win ${showRightPct ? 'show-pct' : ''}" style="flex-basis: ${rightPct}%;">
            <span class="pct-text">${Math.round(awayWinPct)}%</span>
          </div>
        </div>
      `;
    }
    
    function renderMatch(match) {
      const homeWin = match.home_win_prob;
      const draw = match.draw_prob;
      const awayWin = match.away_win_prob;
      
      const hasOdds = homeWin !== null && draw !== null && awayWin !== null;
      
      const homeWinPct = hasOdds ? Math.round(homeWin * 100) : 0;
      const drawPct = hasOdds ? Math.round(draw * 100) : 0;
      const awayWinPct = hasOdds ? Math.round(awayWin * 100) : 0;
      
      // Determine favorite (higher probability)
      const homeFavorite = homeWinPct > awayWinPct;
      const awayFavorite = awayWinPct > homeWinPct;
      
      const matchDate = new Date(match.commence_time).toLocaleDateString('en-GB', { 
        day: 'numeric', 
        month: 'short' 
      });
      
      // Get flags - simplified flag emoji dictionary
      const flagEmoji = {
        'Mexico': '🇲🇽', 'South Africa': '🇿🇦', 'South Korea': '🇰🇷', 'Czechia': '🇨🇿',
        'Canada': '🇨🇦', 'Bosnia and Herzegovina': '🇧🇦', 'Qatar': '🇶🇦', 'Switzerland': '🇨🇭',
        'Brazil': '🇧🇷', 'Morocco': '🇲🇦', 'Haiti': '🇭🇹', 'Scotland': '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
        'USA': '🇺🇸', 'Paraguay': '🇵🇾', 'Australia': '🇦🇺', 'Turkey': '🇹🇷',
        'Germany': '🇩🇪', 'Curaçao': '🇨🇼', 'Ivory Coast': '🇨🇮', 'Ecuador': '🇪🇨',
        'Netherlands': '🇳🇱', 'Japan': '🇯🇵', 'Sweden': '🇸🇪', 'Tunisia': '🇹🇳',
        'Belgium': '🇧🇪', 'Egypt': '🇪🇬', 'Iran': '🇮🇷', 'New Zealand': '🇳🇿',
        'Spain': '🇪🇸', 'Cape Verde': '🇨🇻', 'Saudi Arabia': '🇸🇦', 'Uruguay': '🇺🇾',
        'France': '🇫🇷', 'Senegal': '🇸🇳', 'Iraq': '🇮🇶', 'Norway': '🇳🇴',
        'Argentina': '🇦🇷', 'Algeria': '🇩🇿', 'Austria': '🇦🇹', 'Jordan': '🇯🇴',
        'Portugal': '🇵🇹', 'DR Congo': '🇨🇩', 'Uzbekistan': '🇺🇿', 'Colombia': '🇨🇴',
        'England': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'Croatia': '🇭🇷', 'Ghana': '🇬🇭', 'Panama': '🇵🇦'
      };
      
      const homeFlag = flagEmoji[match.home_team] || '🏴';
      const awayFlag = flagEmoji[match.away_team] || '🏴';
      
      return `
        <div class="match-row">
          <div class="team-cell home">
            <span class="team-name${homeFavorite ? ' favorite' : ''}">${match.home_team}</span>
            <span class="team-flag">${homeFlag}</span>
            ${match.home_owner ? `<span class="owner">${match.home_owner.split(' ')[0]}</span>` : ''}
          </div>
          
          ${renderSplitBar(homeWinPct, drawPct, awayWinPct)}
          
          <div class="team-cell away">
            <span class="team-flag">${awayFlag}</span>
            <span class="team-name${awayFavorite ? ' favorite' : ''}">${match.away_team}</span>
            ${match.away_owner ? `<span class="owner">${match.away_owner.split(' ')[0]}</span>` : ''}
          </div>
          
          <div class="match-date">${matchDate}</div>
        </div>
      `;
    }
    
    function renderGroups() {
      const groupsGrid = document.getElementById('groupsGrid');
      
      // Group matches by group
      const matchesByGroup = {};
      data.upcoming_matches.forEach(match => {
        if (!matchesByGroup[match.group]) {
          matchesByGroup[match.group] = [];
        }
        matchesByGroup[match.group].push(match);
      });
      
      // Render each group
      const sortedGroups = Object.keys(matchesByGroup).sort();
      sortedGroups.forEach(group => {
        const matches = matchesByGroup[group];
        const groupHtml = `
          <div class="group-section">
            <div class="group-header">GROUP ${group}</div>
            ${matches.map(renderMatch).join('')}
          </div>
        `;
        groupsGrid.innerHTML += groupHtml;
      });
    }
    
    // Render the visualization
    renderGroups();
    
    // Signal that rendering is complete
    document.body.classList.add('render-complete');
  </script>
</body>
</html>
