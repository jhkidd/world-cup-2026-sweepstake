<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: white;
      padding: 40px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #2C3E50;
      margin-bottom: 8px;
    }
    
    .subtitle {
      font-size: 13px;
      color: #7F8C8D;
      margin-bottom: 30px;
    }
    
    /* Two-column grid layout */
    .groups-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      column-gap: 40px;
    }
    
    .group-section {
      margin-bottom: 0;
      break-inside: avoid;
    }
    
    .group-header {
      font-size: 18px;
      font-weight: 700;
      color: #2C3E50;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 2px solid #E0E0E0;
    }
    
    .match-row {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      gap: 10px;
    }
    
    .team-cell {
      width: 220px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }
    
    .team-cell.home {
      justify-content: flex-end;
      text-align: right;
    }
    
    .team-cell.away {
      justify-content: flex-start;
      text-align: left;
    }
    
    .team-flag {
      font-size: 16px;
      font-family: "Noto Color Emoji", Arial, sans-serif;
    }
    
    .team-name {
      font-weight: 500;
      color: #2C3E50;
    }
    
    .owner {
      font-size: 11px;
      color: #95A5A6;
      margin-left: 4px;
    }
    
    .odds-box {
      display: flex;
      border: 1px solid #BDC3C7;
      border-radius: 3px;
      overflow: hidden;
    }
    
    .odds-cell {
      width: 60px;
      padding: 6px 4px;
      text-align: center;
      border-right: 1px solid #BDC3C7;
    }
    
    .odds-cell:last-child {
      border-right: none;
    }
    
    .odds-label {
      font-size: 9px;
      font-weight: 600;
      color: #7F8C8D;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    
    .odds-value {
      font-size: 13px;
      font-weight: 700;
      color: #2C3E50;
    }
    
    .odds-value.na {
      color: #BDC3C7;
    }
    
    .match-date {
      width: 60px;
      font-size: 11px;
      color: #95A5A6;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Upcoming Matches - Matchday 1</h1>
    <div class="subtitle">Updated 27 May 2026</div>
    
    <div class="groups-grid" id="groupsGrid">
      <!-- Groups will be inserted here by JavaScript -->
    </div>
  </div>
  
  <script>
    const data = DATA_PLACEHOLDER;
    
    // Helper functions for color interpolation
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }
    
    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join("");
    }
    
    function interpolateColor(color1, color2, factor) {
      const c1 = hexToRgb(color1);
      const c2 = hexToRgb(color2);
      const r = c1.r + factor * (c2.r - c1.r);
      const g = c1.g + factor * (c2.g - c1.g);
      const b = c1.b + factor * (c2.b - c1.b);
      return rgbToHex(r, g, b);
    }
    
    function getColorForProbability(prob) {
      const colorStops = [
        { prob: 1.00, color: '#6DACA8' },
        { prob: 0.90, color: '#78B4A9' },
        { prob: 0.80, color: '#86BDAA' },
        { prob: 0.70, color: '#94C4AB' },
        { prob: 0.60, color: '#A1CBAC' },
        { prob: 0.50, color: '#B1D5AE' },
        { prob: 0.40, color: '#B9DBB1' },
        { prob: 0.30, color: '#CAE4B5' },
        { prob: 0.20, color: '#DCEEC1' },
        { prob: 0.10, color: '#ECF6D0' },
        { prob: 0.02, color: '#FAFDF0' },
        { prob: 0.00, color: '#FFFFFE' }
      ];
      
      if (prob >= 1.0) return colorStops[0].color;
      if (prob <= 0.0) return colorStops[colorStops.length - 1].color;
      
      for (let i = 0; i < colorStops.length - 1; i++) {
        const upper = colorStops[i];
        const lower = colorStops[i + 1];
        
        if (prob <= upper.prob && prob >= lower.prob) {
          const range = upper.prob - lower.prob;
          const factor = (upper.prob - prob) / range;
          return interpolateColor(upper.color, lower.color, factor);
        }
      }
      
      return colorStops[colorStops.length - 1].color;
    }
    
    function getBrightness(hex) {
      const rgb = hexToRgb(hex);
      return (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
    }
    
    function renderOddsCell(label, value, isNA = false) {
      const prob = isNA ? 0 : value / 100;
      const bgColor = isNA ? '#F5F5F5' : getColorForProbability(prob);
      const brightness = getBrightness(bgColor);
      // Use white text for darker backgrounds (probabilities over ~65%)
      const textColor = brightness > 180 ? '#2C3E50' : '#FFFFFF';
      
      return `
        <div class="odds-cell" style="background-color: ${bgColor};">
          <div class="odds-label" style="color: ${textColor}; opacity: 0.7;">${label}</div>
          <div class="odds-value ${isNA ? 'na' : ''}" style="color: ${textColor};">${isNA ? 'N/A' : value + '%'}</div>
        </div>
      `;
    }
    
    function renderMatch(match) {
      const homeWin = match.home_win_prob;
      const draw = match.draw_prob;
      const awayWin = match.away_win_prob;
      
      const hasOdds = homeWin !== null && draw !== null && awayWin !== null;
      
      const homeWinPct = hasOdds ? Math.round(homeWin * 100) : null;
      const drawPct = hasOdds ? Math.round(draw * 100) : null;
      const awayWinPct = hasOdds ? Math.round(awayWin * 100) : null;
      
      const matchDate = new Date(match.commence_time).toLocaleDateString('en-GB', { 
        day: 'numeric', 
        month: 'short' 
      });
      
      // Get flags - simplified flag emoji dictionary
      const flagEmoji = {
        'Mexico': '🇲🇽', 'South Africa': '🇿🇦', 'South Korea': '🇰🇷', 'Czechia': '🇨🇿',
        'Canada': '🇨🇦', 'Bosnia and Herzegovina': '🇧🇦', 'Qatar': '🇶🇦', 'Switzerland': '🇨🇭',
        'Brazil': '🇧🇷', 'Morocco': '🇲🇦', 'Haiti': '🇭🇹', 'Scotland': '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
        'USA': '🇺🇸', 'Paraguay': '🇵🇾', 'Australia': '🇦🇺', 'Turkey': '🇹🇷',
        'Germany': '🇩🇪', 'Curaçao': '🇨🇼', 'Ivory Coast': '🇨🇮', 'Ecuador': '🇪🇨',
        'Netherlands': '🇳🇱', 'Japan': '🇯🇵', 'Sweden': '🇸🇪', 'Tunisia': '🇹🇳',
        'Belgium': '🇧🇪', 'Egypt': '🇪🇬', 'Iran': '🇮🇷', 'New Zealand': '🇳🇿',
        'Spain': '🇪🇸', 'Cape Verde': '🇨🇻', 'Saudi Arabia': '🇸🇦', 'Uruguay': '🇺🇾',
        'France': '🇫🇷', 'Senegal': '🇸🇳', 'Iraq': '🇮🇶', 'Norway': '🇳🇴',
        'Argentina': '🇦🇷', 'Algeria': '🇩🇿', 'Austria': '🇦🇹', 'Jordan': '🇯🇴',
        'Portugal': '🇵🇹', 'DR Congo': '🇨🇩', 'Uzbekistan': '🇺🇿', 'Colombia': '🇨🇴',
        'England': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'Croatia': '🇭🇷', 'Ghana': '🇬🇭', 'Panama': '🇵🇦'
      };
      
      const homeFlag = flagEmoji[match.home_team] || '🏴';
      const awayFlag = flagEmoji[match.away_team] || '🏴';
      
      return `
        <div class="match-row">
          <div class="team-cell home">
            <span class="team-name">${match.home_team}</span>
            <span class="team-flag">${homeFlag}</span>
            ${match.home_owner ? `<span class="owner">${match.home_owner}</span>` : ''}
          </div>
          
          <div class="odds-box">
            ${hasOdds ? 
              renderOddsCell('WIN', homeWinPct) + 
              renderOddsCell('TIE', drawPct) + 
              renderOddsCell('WIN', awayWinPct) 
              : 
              renderOddsCell('WIN', 0, true) + 
              renderOddsCell('TIE', 0, true) + 
              renderOddsCell('WIN', 0, true)
            }
          </div>
          
          <div class="team-cell away">
            <span class="team-flag">${awayFlag}</span>
            <span class="team-name">${match.away_team}</span>
            ${match.away_owner ? `<span class="owner">${match.away_owner}</span>` : ''}
          </div>
          
          <div class="match-date">${matchDate}</div>
        </div>
      `;
    }
    
    function renderGroups() {
      const groupsGrid = document.getElementById('groupsGrid');
      
      // Group matches by group
      const matchesByGroup = {};
      data.upcoming_matches.forEach(match => {
        if (!matchesByGroup[match.group]) {
          matchesByGroup[match.group] = [];
        }
        matchesByGroup[match.group].push(match);
      });
      
      // Render each group
      const sortedGroups = Object.keys(matchesByGroup).sort();
      sortedGroups.forEach(group => {
        const matches = matchesByGroup[group];
        const groupHtml = `
          <div class="group-section">
            <div class="group-header">GROUP ${group}</div>
            ${matches.map(renderMatch).join('')}
          </div>
        `;
        groupsGrid.innerHTML += groupHtml;
      });
    }
    
    // Render the visualization
    renderGroups();
    
    // Signal that rendering is complete
    document.body.classList.add('render-complete');
  </script>
</body>
</html>
