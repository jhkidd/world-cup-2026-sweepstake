<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { padding: 40px; background: white; }
    h1 { color: #2C3E50; }
    .match { padding: 10px; margin: 10px 0; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Upcoming Matches - Matchday 1</h1>
  <div id="matches"></div>
  <script>
    const data = DATA_PLACEHOLDER;
    const container = document.getElementById('matches');
    if (data.upcoming_matches) {
      for (const match of data.upcoming_matches) {
        const div = document.createElement('div');
        div.className = 'match';
        div.innerHTML = match.home_team + ' vs ' + match.away_team + ' (Group ' + match.group + ')';
        container.appendChild(div);
      }
    }
    document.body.classList.add('render-complete');
  </script>
</body>
</html>
