    // Linear color interpolation
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }
    
    function rgbToHex(r, g, b) {
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    
    function interpolateColor(color1, color2, factor) {
      const c1 = hexToRgb(color1);
      const c2 = hexToRgb(color2);
      const r = Math.round(c1.r + factor * (c2.r - c1.r));
      const g = Math.round(c1.g + factor * (c2.g - c1.g));
      const b = Math.round(c1.b + factor * (c2.b - c1.b));
      return rgbToHex(r, g, b);
    }
    
    function getColorForProbability(prob) {
      const stops = [
        { prob: 1.00, color: '#6DACA8' },
        { prob: 0.90, color: '#78B4A9' },
        { prob: 0.80, color: '#86BDAA' },
        { prob: 0.70, color: '#94C4AB' },

        { prob: 0.50, color: '#B1D5AE' },
        { prob: 0.40, color: '#B9DBB1' },
        { prob: 0.30, color: '#CAE4B5' },
        { prob: 0.20, color: '#DCEEC1' },
        { prob: 0.10, color: '#ECF6D0' },
        { prob: 0.02, color: '#FAFDF0' },
        { prob: 0.00, color: '#FFFFFE' }
      ];
      
      for (let i = 0; i < stops.length - 1; i++) {
        if (prob >= stops[i + 1].prob) {
          const lower = stops[i + 1];
          const upper = stops[i];
          const range = upper.prob - lower.prob;
          const factor = (prob - lower.prob) / range;
          return interpolateColor(lower.color, upper.color, factor);
        }
      }
      
      return stops[stops.length - 1].color;
    }

      'Netherlands': '\u{1F1F3}\u{1F1F1}', 'New Zealand': '\u{1F1F3}\u{1F1FF}', 'Norway': '\u{1F1F3}\u{1F1F4}',
      'Panama': '\u{1F1F5}\u{1F1E6}', 'Paraguay': '\u{1F1F5}\u{1F1FE}', 'Portugal': '\u{1F1F5}\u{1F1F9}',
      'Qatar': '\u{1F1F6}\u{1F1E6}',
      'Saudi Arabia': '\u{1F1F8}\u{1F1E6}', 'Senegal': '\u{1F1F8}\u{1F1F3}', 
      'Scotland': '\u{1F3F4}\u{E0067}\u{E0062}\u{E0073}\u{E0063}\u{E0074}\u{E007F}', 
      'Sweden': '\u{1F1F8}\u{1F1EA}', 'Switzerland': '\u{1F1E8}\u{1F1ED}', 'South Africa': '\u{1F1FF}\u{1F1E6}',
      'Tunisia': '\u{1F1F9}\u{1F1F3}', 'Turkey': '\u{1F1F9}\u{1F1F7}', 'Türkiye': '\u{1F1F9}\u{1F1F7}',
      'Uruguay': '\u{1F1FA}\u{1F1FE}', 'USA': '\u{1F1FA}\u{1F1F8}', 'Uzbekistan': '\u{1F1FA}\u{1F1FF}',
      'Cape Verde': '\u{1F1E8}\u{1F1FB}'
    };
    
    // Update subtitle
    const date = new Date(data.timestamp);
    document.getElementById('subtitle').textContent = 
      `Updated ${date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`;
    
    // Group matches by group
    const matchesByGroup = {};
    if (data.upcoming_matches && data.upcoming_matches.length > 0) {
      for (const match of data.upcoming_matches) {
        if (!matchesByGroup[match.group]) {
          matchesByGroup[match.group] = [];
        }
        matchesByGroup[match.group].push(match);
      }
      
      // Render each group
      const container = document.getElementById('matches-container');
      const groups = Object.keys(matchesByGroup).sort();
      
      for (const group of groups) {
        const section = document.createElement('div');
        section.className = 'group-section';
        
        const header = document.createElement('div');
        header.className = 'group-header';
        header.textContent = `GROUP ${group}`;
        section.appendChild(header);
        
        const matches = matchesByGroup[group];
        for (const match of matches) {
          const row = document.createElement('div');
          row.className = 'match-row';
          
          const matchDate = new Date(match.commence_time);
          const dateStr = matchDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
          
          const homeFlag = flagEmojis[match.home_team] || '🏴';
          const awayFlag = flagEmojis[match.away_team] || '🏴';
          
          const homeOwner = match.home_owner ? `⭐${match.home_owner.split(' ')[0]}` : '';
          const awayOwner = match.away_owner ? `⭐${match.away_owner.split(' ')[0]}` : '';
          
          const homeWinBg = getColorForProbability(match.home_win_prob || 0);
          const drawBg = getColorForProbability(match.draw_prob || 0);
          const awayWinBg = getColorForProbability(match.away_win_prob || 0);
          
          const homeWinText = getTextColorForBackground(homeWinBg);
          const drawText = getTextColorForBackground(drawBg);
          const awayWinText = getTextColorForBackground(awayWinBg);
          
          row.innerHTML = `
            <div class="match-date">${dateStr}</div>
            <div class="team-cell home">
              <span class="team-name">${match.home_team}</span>
              <span class="team-flag">${homeFlag}</span>
              ${homeOwner ? `<span class="team-owner">${homeOwner}</span>` : ''}
              <span class="team-points">0 Pts.</span>
            </div>
            <div class="odds-box">
              <div class="odds-cell" style="background: ${homeWinBg}; color: ${homeWinText};">
                <div class="odds-header">win</div>
                <div class="odds-value">${Math.round((match.home_win_prob || 0) * 100)}%</div>
              </div>
              <div class="odds-cell" style="background: ${drawBg}; color: ${drawText};">
                <div class="odds-header">tie</div>
                <div class="odds-value">${Math.round((match.draw_prob || 0) * 100)}%</div>
              </div>
              <div class="odds-cell" style="background: ${awayWinBg}; color: ${awayWinText};">
                <div class="odds-header">win</div>
                <div class="odds-value">${Math.round((match.away_win_prob || 0) * 100)}%</div>
              </div>
            </div>
            <div class="team-cell away">
              <span class="team-flag">${awayFlag}</span>
              <span class="team-name">${match.away_team}</span>
              ${awayOwner ? `<span class="team-owner">${awayOwner}</span>` : ''}
              <span class="team-points">0 Pts.</span>
            </div>
          `;
          
          section.appendChild(row);
        }
        
        container.appendChild(section);
      }
    } else {
      document.getElementById('no-matches').style.display = 'block';
    }
    
    // Signal ready for screenshot
    document.body.classList.add('render-complete');
  </script>
</body>
</html>
